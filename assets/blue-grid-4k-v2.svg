<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <title>Blue studio grid</title>
  <desc>A resolution-independent cobalt grid with a soft blue central glow and navy edges.</desc>
  <defs>
    <radialGradient id="blue" cx="51%" cy="57%" r="70%">
      <stop stop-color="#2378ed"/>
      <stop offset=".33" stop-color="#1956c5"/>
      <stop offset=".66" stop-color="#102b78"/>
      <stop offset="1" stop-color="#040c2a"/>
    </radialGradient>
    <radialGradient id="light" cx="48%" cy="58%" r="51%">
      <stop stop-color="#5aabff" stop-opacity=".17"/>
      <stop offset=".68" stop-color="#296add" stop-opacity=".035"/>
      <stop offset="1" stop-color="#296add" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="50%" cy="52%" r="68%">
      <stop offset=".3" stop-color="#020b22" stop-opacity="0"/>
      <stop offset=".78" stop-color="#020b22" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020b22" stop-opacity=".46"/>
    </radialGradient>
    <pattern id="fine-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7cafff" stroke-opacity=".22" stroke-width="1.1"/>
    </pattern>
    <pattern id="main-grid" width="320" height="320" patternUnits="userSpaceOnUse">
      <path d="M320 0H0V320" fill="none" stroke="#91c6ff" stroke-opacity=".42" stroke-width="1.6"/>
    </pattern>
  </defs>
  <path fill="url(#blue)" d="M0 0H3840V2160H0Z"/>
  <path fill="url(#light)" d="M0 0H3840V2160H0Z"/>
  <g transform="matrix(1 .035 -.018 1 12 -115)">
    <path fill="url(#fine-grid)" d="M-400 -400H4300V2600H-400Z"/>
    <path fill="url(#main-grid)" d="M-400 -400H4300V2600H-400Z"/>
  </g>
  <path fill="url(#edge)" d="M0 0H3840V2160H0Z"/>
</svg>
